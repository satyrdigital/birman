name: macOS keyboard layout package

on:
  push:
    branches:
      - modernize/macos-flagless-security
    paths:
      - 'Mac/**'
      - '.github/workflows/macos-package.yml'
  pull_request:
    paths:
      - 'Mac/**'
      - '.github/workflows/macos-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML, generate neutral icon, build all-users PKG
        shell: bash
        run: bash Mac/scripts/build-pkg.sh
      - name: Record package SHA-256
        shell: bash
        run: shasum -a 256 dist/*.pkg > dist/SHA256SUMS.txt
      - name: Archive unsigned package for testing
        uses: actions/upload-artifact@v4
        with:
          name: birman-macos-pkg
          path: |
            dist/*.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
